{{- if .Values.backend.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "money-keeper.fullname" . }}-backend-pdb
  labels:
    {{- include "money-keeper.labels" . | nindent 4 }}
    app: {{ include "money-keeper.fullname" . }}-backend
spec:
  minAvailable: {{ .Values.backend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "money-keeper.selectorLabels" . | nindent 6 }}
      app: {{ include "money-keeper.fullname" . }}-backend
{{- end }}
