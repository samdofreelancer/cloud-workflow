{{- if not (lookup "v1" "Secret" .Release.Namespace .Values.backend.secretRef) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.secretRef | default (include "money-keeper.fullname" .) }}-secret
  labels:
    {{- include "money-keeper.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_USER: {{ .Values.database.user | b64enc | quote }}
  DATABASE_PASSWORD: {{ .Values.database.password | b64enc | quote }}
{{- end }}
