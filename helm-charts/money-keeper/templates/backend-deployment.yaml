{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "money-keeper.fullname" . }}-backend
  labels:
    {{- include "money-keeper.labels" . | nindent 4 }}
    app: {{ include "money-keeper.fullname" . }}-backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "money-keeper.selectorLabels" . | nindent 6 }}
      app: {{ include "money-keeper.fullname" . }}-backend
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "money-keeper.selectorLabels" . | nindent 8 }}
        app: {{ include "money-keeper.fullname" . }}-backend
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "money-keeper.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.backend.securityContext | nindent 8 }}
      containers:
      - name: backend
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.backend.service.targetPort }}
          protocol: TCP
        env:
        {{- range $key, $value := .Values.backend.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        # Database configuration from secrets
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.backend.secretRef }}
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.backend.secretRef }}
              key: DATABASE_PASSWORD
        # Database host from ConfigMap
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.backend.configMap }}
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.backend.configMap }}
              key: DATABASE_PORT
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.backend.configMap }}
              key: DATABASE_NAME
        
        {{- if .Values.backend.healthCheck.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.backend.healthCheck.livenessProbe.path }}
            port: http
          initialDelaySeconds: {{ .Values.backend.healthCheck.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.backend.healthCheck.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.backend.healthCheck.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.backend.healthCheck.livenessProbe.failureThreshold }}
        
        readinessProbe:
          httpGet:
            path: {{ .Values.backend.healthCheck.readinessProbe.path }}
            port: http
          initialDelaySeconds: {{ .Values.backend.healthCheck.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.backend.healthCheck.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.backend.healthCheck.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.backend.healthCheck.readinessProbe.failureThreshold }}
        {{- end }}
        
        resources:
          {{- toYaml .Values.backend.resources | nindent 12 }}
      
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
