name: Run Unit Tests
description: |
  Executes Maven unit tests with configurable Maven profile.
  Generates test reports compatible with aggregation.

inputs:
  working-directory:
    description: 'Working directory containing pom.xml'
    required: true
    default: 'backend'

  maven-profile:
    description: 'Maven profile to activate for tests'
    required: false
    default: 'small-test'

  maven-args:
    description: 'Additional Maven arguments'
    required: false
    default: ''

outputs:
  test-exit-code:
    description: 'Maven test command exit code'
    value: ${{ steps.run-tests.outputs.exit-code }}

  test-report-path:
    description: 'Path to generated test reports'
    value: ${{ steps.run-tests.outputs.report-path }}

runs:
  using: composite

  steps:
    - name: Run unit tests
      id: run-tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e
        mvn clean test -P${{ inputs.maven-profile }} ${{ inputs.maven-args }}
        EXIT_CODE=$?
        set -e
        
        echo "exit-code=${EXIT_CODE}" >> $GITHUB_OUTPUT
        echo "report-path=target/surefire-reports" >> $GITHUB_OUTPUT
        
        exit $EXIT_CODE

    - name: Log test results
      if: always()
      shell: bash
      run: |
        echo "Test execution completed with exit code: ${{ steps.run-tests.outputs.exit-code }}"
