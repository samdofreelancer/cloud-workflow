name: Setup Database (Oracle + Flyway) - Consolidated
description: |
  Unified database setup action.
  - Starts Oracle container using docker-compose
  - Waits for database readiness
  - Runs Flyway migrations
  - Provides connection string output
  
  This action consolidates database setup responsibilities.
  Single source of truth for database initialization.

inputs:
  oracle-password:
    description: 'Oracle database password (ORACLE_PASSWORD)'
    required: true

  oracle-port:
    description: 'Host port for Oracle container (container port: 1521)'
    required: false
    default: '1522'

  docker-compose-file:
    description: 'Path to docker-compose.yml'
    required: false
    default: 'docker-compose.yml'

  skip-flyway:
    description: 'Skip Flyway migration if true (useful for setup-only scenarios)'
    required: false
    default: 'false'

  wait-timeout:
    description: 'Timeout in seconds for database readiness'
    required: false
    default: '300'

outputs:
  connection-string:
    description: 'JDBC connection string for Oracle'
    value: 'jdbc:oracle:thin:@localhost:${{ inputs.oracle-port }}/XEPDB1'

  ready:
    description: 'Whether Oracle is ready for connections'
    value: ${{ steps.verify-readiness.outputs.ready }}

runs:
  using: composite

  steps:
    - name: Log input configuration
      shell: bash
      run: |
        echo "=== Database Setup Configuration ==="
        echo "Oracle Port: ${{ inputs.oracle-port }}"
        echo "Docker Compose: ${{ inputs.docker-compose-file }}"
        echo "Flyway Enabled: ${{ inputs.skip-flyway == 'false' && 'yes' || 'no' }}"
        echo "Readiness Timeout: ${{ inputs.wait-timeout }}s"

    - name: Start Oracle container
      id: start-oracle
      shell: bash
      env:
        ORACLE_PASSWORD: ${{ inputs.oracle-password }}
      run: |
        echo "Starting Oracle container..."
        docker compose -f "${{ inputs.docker-compose-file }}" up -d oracle
        
        if [ $? -eq 0 ]; then
          echo "✓ Oracle container started"
          echo "started=true" >> $GITHUB_OUTPUT
        else
          echo "✗ Failed to start Oracle container"
          echo "started=false" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Wait for Oracle port to be listening
      id: wait-port
      shell: bash
      run: |
        MAX_ATTEMPTS=60
        ATTEMPT=1
        PORT=${{ inputs.oracle-port }}
        
        echo "Waiting for Oracle to listen on port $PORT..."
        
        while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
          if timeout 2 bash -c "</dev/tcp/localhost/$PORT" 2>/dev/null; then
            echo "✓ Oracle is listening on port $PORT (attempt $ATTEMPT)"
            sleep 2
            echo "listening=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Waiting... (attempt $ATTEMPT/$MAX_ATTEMPTS)"
          sleep 2
          ATTEMPT=$((ATTEMPT + 1))
        done
        
        echo "✗ Oracle failed to listen within $MAX_ATTEMPTS attempts"
        echo "listening=false" >> $GITHUB_OUTPUT
        exit 1

    - name: Verify database connectivity
      id: verify-readiness
      shell: bash
      env:
        ORACLE_PASSWORD: ${{ inputs.oracle-password }}
      run: |
        TIMEOUT=${{ inputs.wait-timeout }}
        ELAPSED=0
        INTERVAL=5
        
        echo "Verifying database connectivity..."
        
        while [ $ELAPSED -lt $TIMEOUT ]; do
          if docker compose -f "${{ inputs.docker-compose-file }}" exec -T oracle sqlplus -v > /dev/null 2>&1; then
            echo "✓ Oracle database is ready and accepting connections"
            echo "ready=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Database not ready yet... ($ELAPSED/$TIMEOUT seconds)"
          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
        done
        
        echo "✗ Oracle failed to become ready within $TIMEOUT seconds"
        docker compose -f "${{ inputs.docker-compose-file }}" ps oracle
        echo "ready=false" >> $GITHUB_OUTPUT
        exit 1

    - name: Run Flyway migration
      if: inputs.skip-flyway == 'false'
      shell: bash
      env:
        ORACLE_PASSWORD: ${{ inputs.oracle-password }}
      run: |
        echo "Running Flyway migrations..."
        docker compose -f "${{ inputs.docker-compose-file }}" run --rm flyway
        
        if [ $? -eq 0 ]; then
          echo "✓ Flyway migrations completed successfully"
        else
          echo "✗ Flyway migrations failed"
          exit 1
        fi

    - name: Log database status
      if: always()
      shell: bash
      run: |
        echo "=== Docker Services Status ==="
        docker compose -f "${{ inputs.docker-compose-file }}" ps oracle || true
        docker compose -f "${{ inputs.docker-compose-file }}" ps flyway || true

    - name: Output connection information
      shell: bash
      run: |
        echo "=== Database Connection Information ==="
        echo "Host: localhost"
        echo "Port: ${{ inputs.oracle-port }}"
        echo "Service: XEPDB1"
        echo "Connection String: jdbc:oracle:thin:@localhost:${{ inputs.oracle-port }}/XEPDB1"

