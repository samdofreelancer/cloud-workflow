name: Setup Database (Oracle + Flyway)
description: 'Setup Oracle database and run Flyway migrations'

inputs:
  oracle-password:
    description: 'Oracle database password'
    required: true
  oracle-port:
    description: 'Oracle database port'
    required: false
    default: '1522'

  verify-port-connectivity:
    description: 'Verify localhost port connectivity after DB becomes healthy'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Start Docker Compose services
      shell: bash
      run: |
        echo "Starting Docker Compose services..."
        docker compose up -d oracle
      env:
        ORACLE_PASSWORD: ${{ inputs.oracle-password }}

    - name: Wait for Oracle to be healthy
      shell: bash
      run: |
        echo "Waiting for Oracle to be healthy..."
        max_attempts=60
        attempt=1

        while [ $attempt -le $max_attempts ]; do
          # Check if container is running
          if ! docker ps | grep -q oracle; then
            echo "Attempt $attempt/$max_attempts: Oracle container not running..."
            sleep 2
            attempt=$((attempt+1))
            continue
          fi

          # Check if port is listening
          if timeout 2 bash -c "</dev/tcp/localhost/${{ inputs.oracle-port }}" 2>/dev/null; then
            echo "Oracle is listening on port ${{ inputs.oracle-port }}"
            sleep 2
            exit 0
          fi

          echo "Attempt $attempt/$max_attempts: Oracle not ready..."
          sleep 2
          attempt=$((attempt+1))
        done

        echo "ERROR: Oracle failed to start after $max_attempts attempts"
        docker compose logs oracle
        exit 1

    - name: Verify port connectivity (optional)
      if: inputs.verify-port-connectivity == 'true'
      shell: bash
      run: |
        echo "=== Network connectivity test ==="
        docker ps
        timeout 5 bash -c "</dev/tcp/localhost/${{ inputs.oracle-port }}" && echo "✓ Port ${{ inputs.oracle-port }} is open" || (echo "✗ Port ${{ inputs.oracle-port }} is NOT open" && exit 1)

    - name: Run Flyway migration
      shell: bash
      run: |
        echo "Running Flyway migration..."
        docker compose run --rm flyway
      env:
        ORACLE_PASSWORD: ${{ inputs.oracle-password }}

