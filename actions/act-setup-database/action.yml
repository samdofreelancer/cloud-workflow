name: Setup Database (Oracle + Flyway)
description: 'Setup Oracle database and run Flyway migrations'

inputs:
  oracle-password:
    description: 'Oracle database password'
    required: true
  oracle-port:
    description: 'Oracle database port'
    required: false
    default: '1522'

runs:
  using: composite
  steps:
    - name: Setup Oracle
      uses: samdofreelancer/cloud-workflow/actions/act-setup-oracle@develop
      with:
        oracle-password: ${{ inputs.oracle-password }}
        oracle-port: ${{ inputs.oracle-port }}

    - name: Start Docker Compose services in background
      shell: bash
      run: |
        echo "Starting Docker Compose services..."
        docker compose up -d
      env:
        ORACLE_PASSWORD: ${{ inputs.oracle-password }}

    - name: Wait for Oracle to be ready
      shell: bash
      run: |
        echo "Waiting for Oracle to accept connections..."
        for i in {1..60}; do
          if timeout 2 bash -c "</dev/tcp/localhost/1522" 2>/dev/null; then
            echo "Oracle port 1522 is open"
            sleep 3
            echo "Oracle is ready"
            exit 0
          fi
          echo "Attempt $i/60: Oracle not responding on port 1522..."
          sleep 2
        done
        echo "Oracle failed to start after 120 seconds"
        docker compose logs oracle
        exit 1
      env:
        ORACLE_PASSWORD: ${{ inputs.oracle-password }}

    - name: Run Flyway migration
      shell: bash
      run: |
        echo "Running Flyway migration..."
        docker compose run --rm flyway
      env:
        ORACLE_PASSWORD: ${{ inputs.oracle-password }}
