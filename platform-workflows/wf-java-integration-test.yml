name: Java Integration Test Workflow

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory containing backend code'
        required: false
        type: string
        default: 'backend'
      java-version:
        description: 'Java version (e.g., "17", "21")'
        required: false
        type: string
        default: '17'
      node-version:
        description: 'Node.js version for report aggregation'
        required: false
        type: string
        default: '18'
      maven-profile:
        description: 'Maven profile for integration tests'
        required: false
        type: string
        default: 'medium-test'
      maven-args:
        description: 'Additional Maven arguments'
        required: false
        type: string
        default: '-DskipUnitTests=true'
      oracle-enabled:
        description: 'Whether to start Oracle container'
        required: false
        type: boolean
        default: true
      artifact-retention-days:
        description: 'Number of days to retain test reports'
        required: false
        type: number
        default: 30
    secrets:
      oracle-password:
        description: 'Oracle database password'
        required: true

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    
    env:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@localhost:1522/XEPDB1
      VITE_BACKEND_HOST: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Oracle
        if: inputs.oracle-enabled
        uses: company/github-platform/actions/act-setup-oracle@v1
        with:
          oracle-password: ${{ secrets.oracle-password }}
          oracle-port: '1522'

      - name: Setup Java
        uses: company/github-platform/actions/act-setup-java@v1
        with:
          java-version: ${{ inputs.java-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Setup Node.js
        uses: company/github-platform/actions/act-setup-node@v1
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run Flyway migration
        if: inputs.oracle-enabled
        run: |
          docker compose up flyway
        env:
          ORACLE_PASSWORD: ${{ secrets.oracle-password }}

      - name: Run integration tests
        uses: company/github-platform/actions/act-run-integration-test@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          maven-profile: ${{ inputs.maven-profile }}
          maven-args: ${{ inputs.maven-args }}

      - name: Aggregate test reports
        if: always()
        uses: company/github-platform/actions/act-aggregate-test-report@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          report-input-dir: target/medium-test-reports
          script-location: scripts/aggregate-test-report.js

      - name: Upload test reports
        if: always()
        uses: company/github-platform/actions/act-upload-test-report@v1
        with:
          artifact-name: surefire-report-integration
          report-path: ${{ inputs.working-directory }}/target/medium-test-reports
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Cleanup services
        if: always() && inputs.oracle-enabled
        run: docker compose down
        env:
          ORACLE_PASSWORD: ${{ secrets.oracle-password }}
