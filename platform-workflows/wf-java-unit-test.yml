name: Java Unit Test Workflow

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory containing backend code'
        required: false
        type: string
        default: 'backend'
      java-version:
        description: 'Java version (e.g., "17", "21")'
        required: false
        type: string
        default: '17'
      node-version:
        description: 'Node.js version for report aggregation'
        required: false
        type: string
        default: '18'
      maven-profile:
        description: 'Maven profile for unit tests'
        required: false
        type: string
        default: 'small-test'
      maven-args:
        description: 'Additional Maven arguments'
        required: false
        type: string
        default: ''
      artifact-retention-days:
        description: 'Number of days to retain test reports'
        required: false
        type: number
        default: 30
    secrets:
      # Define secrets if needed by actions

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: company/github-platform/actions/act-setup-java@v1
        with:
          java-version: ${{ inputs.java-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Setup Node.js
        uses: company/github-platform/actions/act-setup-node@v1
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run unit tests
        uses: company/github-platform/actions/act-run-unit-test@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          maven-profile: ${{ inputs.maven-profile }}
          maven-args: ${{ inputs.maven-args }}

      - name: Aggregate test reports
        if: always()
        uses: company/github-platform/actions/act-aggregate-test-report@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          report-input-dir: target/small-test-reports
          script-location: scripts/aggregate-test-report.js

      - name: Upload test reports
        if: always()
        uses: company/github-platform/actions/act-upload-test-report@v1
        with:
          artifact-name: surefire-report-unit
          report-path: ${{ inputs.working-directory }}/target/small-test-reports
          retention-days: ${{ inputs.artifact-retention-days }}
