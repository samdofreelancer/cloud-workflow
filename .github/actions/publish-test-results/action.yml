name: Publish Test Results
description: Publish test results and coverage reports
author: Money Keeper Team

inputs:
  backend-dir:
    description: Backend directory path
    required: false
    default: ./backend

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        path: reports/

    - uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: reports/tests-**/TEST-*.xml
        check_name: Backend Tests
        comment_mode: off

    - uses: actions/upload-artifact@v4
      with:
        name: jacoco-report-final
        path: reports/coverage-*/
        retention-days: 30
