name: Backend Unit Tests
description: Run backend unit tests with JaCoCo coverage
author: Money Keeper Team

inputs:
  backend-dir:
    description: Backend directory path
    required: false
    default: ./backend
  sha-short:
    description: Short Git SHA for artifact naming
    required: true

outputs:
  coverage-artifact-name:
    description: Name of the coverage artifact
    value: coverage-unit-${{ inputs.sha-short }}
  tests-artifact-name:
    description: Name of the test results artifact
    value: tests-unit-${{ inputs.sha-short }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles(format('{0}/pom.xml', inputs.backend-dir)) }}
        restore-keys: ${{ runner.os }}-maven-

    - uses: actions/download-artifact@v4
      with:
        name: build-${{ inputs.sha-short }}
        path: ${{ inputs.backend-dir }}/target/

    - name: Run unit tests
      shell: bash
      run: mvn test -Psmall-test -Djacoco.skip=false --batch-mode --errors
      working-directory: ${{ inputs.backend-dir }}

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-unit-${{ inputs.sha-short }}
        path: ${{ inputs.backend-dir }}/target/site/jacoco/
        retention-days: 5

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tests-unit-${{ inputs.sha-short }}
        path: ${{ inputs.backend-dir }}/target/surefire-reports/
        retention-days: 5

    - uses: actions/download-artifact@v4
      if: always()
      with:
        path: reports/

    - uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: reports/tests-**/TEST-*.xml
        check_name: Unit Tests
        comment_mode: off
