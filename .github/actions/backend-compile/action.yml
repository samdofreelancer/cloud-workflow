name: Backend Compile
description: Compile backend source code with Maven
author: Money Keeper Team

inputs:
  backend-dir:
    description: Backend directory path
    required: false
    default: ./backend
  sha-short:
    description: Short Git SHA for artifact naming
    required: true

outputs:
  build-artifact-name:
    description: Name of the compiled build artifact
    value: build-${{ inputs.sha-short }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - name: Compile source
      shell: bash
      run: mvn clean compile -DskipTests -Djacoco.skip=false --batch-mode --errors
      working-directory: ${{ inputs.backend-dir }}
      env:
        MAVEN_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository

    - uses: actions/upload-artifact@v4
      with:
        name: build-${{ inputs.sha-short }}
        path: ${{ inputs.backend-dir }}/target/
        retention-days: 1

    - uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: m2-repository-${{ hashFiles(format('{0}/pom.xml', inputs.backend-dir)) }}
        path: ${{ github.workspace }}/.m2/repository
        retention-days: 7
        if-no-files-found: ignore
