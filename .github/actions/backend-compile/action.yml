name: Backend Compile
description: Compile backend source code with Maven
author: Money Keeper Team

inputs:
  backend-dir:
    description: Backend directory path
    required: false
    default: ./backend
  sha-short:
    description: Short Git SHA for artifact naming
    required: true

outputs:
  build-artifact-name:
    description: Name of the compiled build artifact
    value: build-${{ inputs.sha-short }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - name: Debug - Check workspace
      shell: bash
      run: |
        echo "PWD: $PWD"
        echo "HOME: $HOME"
        echo "Contents of current directory:"
        ls -la

    - name: Compile source
      shell: bash
      run: |
        echo "Starting Maven compile..."
        echo "Maven version:"
        mvn --version
        echo ""
        echo "Running: mvn clean compile -DskipTests -Djacoco.skip=false -Dmaven.repo.local=$HOME/.m2/repository --batch-mode --errors"
        mvn clean compile \
          -DskipTests \
          -Djacoco.skip=false \
          -Dmaven.repo.local=$HOME/.m2/repository \
          --batch-mode \
          --errors \
          -Dorg.slf4j.simpleLogger.defaultLogLevel=info || {
          echo "Maven failed with exit code $?"
          exit 1
        }
        echo "Maven compile completed successfully"
      working-directory: ${{ inputs.backend-dir }}

    - name: Debug - Check m2 after compile
      shell: bash
      run: |
        echo "=== Maven Build Results ==="
        echo "Working directory: $PWD"
        echo "HOME: $HOME"
        echo ""
        echo "=== Target directory contents ==="
        if [ -d "target" ]; then
          du -sh target/
          ls -lah target/ | head -30
        else
          echo "No target directory"
        fi
        echo ""
        echo "=== M2 Repository ==="
        if [ -d "$HOME/.m2/repository" ]; then
          echo "✓ m2 repository exists at $HOME/.m2/repository"
          du -sh "$HOME/.m2/repository"
          echo ""
          echo "First 20 items in m2:"
          ls -lah "$HOME/.m2/repository" | head -20
        else
          echo "✗ m2 repository NOT found at $HOME/.m2/repository"
          echo ""
          echo "HOME contents:"
          ls -lah "$HOME"
        fi
        echo ""
        echo "=== pom.xml location ==="
        ls -la pom.xml

    - uses: actions/upload-artifact@v4
      with:
        name: build-${{ inputs.sha-short }}
        path: ${{ inputs.backend-dir }}/target/
        retention-days: 1

    - uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: m2-repository-${{ hashFiles(format('{0}/pom.xml', inputs.backend-dir)) }}
        path: ~/.m2/repository
        retention-days: 7
        if-no-files-found: ignore
