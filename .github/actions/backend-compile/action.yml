name: Backend Compile
description: Compile backend source code with Maven
author: Money Keeper Team

inputs:
  backend-dir:
    description: Backend directory path
    required: false
    default: ./backend
  sha-short:
    description: Short Git SHA for artifact naming
    required: true

outputs:
  build-artifact-name:
    description: Name of the compiled build artifact
    value: build-${{ inputs.sha-short }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - name: Debug - Check workspace
      shell: bash
      run: |
        echo "PWD: $PWD"
        echo "HOME: $HOME"
        echo "Contents of current directory:"
        ls -la

    - name: Compile source
      shell: bash
      run: mvn clean compile -DskipTests -Djacoco.skip=false -Dmaven.repo.local=$HOME/.m2/repository --batch-mode --errors
      working-directory: ${{ inputs.backend-dir }}

    - name: Debug - Check m2 after compile
      shell: bash
      run: |
        echo "Checking m2 repository at $HOME/.m2/repository:"
        if [ -d "$HOME/.m2/repository" ]; then
          echo "✓ m2 repository exists"
          du -sh "$HOME/.m2/repository"
          ls -la "$HOME/.m2/repository" | head -20
        else
          echo "✗ m2 repository NOT found"
          echo "HOME is: $HOME"
          ls -la "$HOME"
        fi

    - uses: actions/upload-artifact@v4
      with:
        name: build-${{ inputs.sha-short }}
        path: ${{ inputs.backend-dir }}/target/
        retention-days: 1

    - uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: m2-repository-${{ hashFiles(format('{0}/pom.xml', inputs.backend-dir)) }}
        path: ~/.m2/repository
        retention-days: 7
        if-no-files-found: ignore
