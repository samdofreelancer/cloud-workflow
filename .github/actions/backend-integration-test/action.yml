name: Backend Integration Tests
description: Run backend integration tests with Oracle service and JaCoCo coverage
author: Money Keeper Team

inputs:
  backend-dir:
    description: Backend directory path
    required: false
    default: ./backend
  sha-short:
    description: Short Git SHA for artifact naming
    required: true
  oracle-password:
    description: Oracle database password
    required: true

outputs:
  coverage-artifact-name:
    description: Name of the coverage artifact
    value: coverage-integration-${{ inputs.sha-short }}
  tests-artifact-name:
    description: Name of the test results artifact
    value: tests-integration-${{ inputs.sha-short }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles(format('{0}/pom.xml', inputs.backend-dir)) }}
        restore-keys: ${{ runner.os }}-maven-

    - uses: actions/download-artifact@v4
      with:
        name: build-${{ inputs.sha-short }}
        path: ${{ inputs.backend-dir }}/target/

    - name: Migrate database
      shell: bash
      run: mvn flyway:migrate -Dflyway.locations=filesystem:src/main/resources/db/migration/oracle --batch-mode
      working-directory: ${{ inputs.backend-dir }}
      continue-on-error: true
      env:
        SPRING_DATASOURCE_PASSWORD: ${{ inputs.oracle-password }}

    - name: Run integration tests
      shell: bash
      run: mvn verify -Pmedium-test -DskipUnitTests=true -Djacoco.skip=false --batch-mode --errors
      working-directory: ${{ inputs.backend-dir }}
      env:
        SPRING_DATASOURCE_PASSWORD: ${{ inputs.oracle-password }}

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-integration-${{ inputs.sha-short }}
        path: ${{ inputs.backend-dir }}/target/site/jacoco/
        retention-days: 5

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tests-integration-${{ inputs.sha-short }}
        path: ${{ inputs.backend-dir }}/target/failsafe-reports/
        retention-days: 5

    - uses: actions/download-artifact@v4
      if: always()
      with:
        path: reports/

    - uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: reports/tests-**/TEST-*.xml
        check_name: Integration Tests
        comment_mode: off
