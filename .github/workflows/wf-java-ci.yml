name: Java CI Workflow

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory containing backend code'
        required: false
        type: string
        default: 'backend'
      java-version:
        description: 'Java version (e.g., "17", "21")'
        required: false
        type: string
        default: '17'
      artifact-retention-days:
        description: 'Number of days to retain test reports'
        required: false
        type: number
        default: 30
    secrets:
      oracle-password:
        description: 'Oracle database password'
        required: true

jobs:
  setup:
    name: Setup environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Oracle
        uses: samdofreelancer/cloud-workflow/actions/act-setup-oracle@develop
        with:
          oracle-password: ${{ secrets.oracle-password }}
          oracle-port: '1522'

      - name: Setup Java
        uses: samdofreelancer/cloud-workflow/actions/act-setup-java@develop
        with:
          java-version: ${{ inputs.java-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Run Flyway migration
        run: |
          docker compose up flyway
        env:
          ORACLE_PASSWORD: ${{ secrets.oracle-password }}

  compile:
    name: Compile source
    runs-on: ubuntu-latest
    needs: setup
    env:
      SPRING_PROFILES_ACTIVE: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: samdofreelancer/cloud-workflow/actions/act-setup-java@develop
        with:
          java-version: ${{ inputs.java-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Compile source
        run: |
          cd ${{ inputs.working-directory }}
          mvn clean compile -DskipTests

      - name: Upload compiled target folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-target
          path: ${{ inputs.working-directory }}/target
          retention-days: 1
          if-no-files-found: 'ignore'

      - name: Upload m2 repository cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-repository
          path: ~/.m2/repository
          retention-days: 1
          if-no-files-found: 'ignore'

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: compile
    env:
      SPRING_PROFILES_ACTIVE: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: samdofreelancer/cloud-workflow/actions/act-setup-java@develop
        with:
          java-version: ${{ inputs.java-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Download compiled target folder
        uses: actions/download-artifact@v4
        with:
          name: compiled-target
          path: ${{ inputs.working-directory }}/target

      - name: Download m2 repository cache
        uses: actions/download-artifact@v4
        with:
          name: m2-repository
          path: ~/.m2/repository

      - name: Run unit tests
        uses: samdofreelancer/cloud-workflow/actions/act-run-unit-test@develop
        with:
          working-directory: ${{ inputs.working-directory }}
          maven-profile: 'small-test'

      - name: Aggregate unit test reports
        if: always()
        continue-on-error: true
        uses: samdofreelancer/cloud-workflow/actions/act-aggregate-test-report@develop
        with:
          working-directory: ${{ inputs.working-directory }}
          report-input-dir: target/small-test-reports
          script-location: scripts/aggregate-test-report.js

      - name: Upload unit test reports
        if: always()
        continue-on-error: true
        uses: samdofreelancer/cloud-workflow/actions/act-upload-test-report@develop
        with:
          artifact-name: surefire-report-unit
          report-path: ${{ inputs.working-directory }}/target/small-test-reports
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: 'ignore'

      - name: Upload jacoco unit test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-unit
          path: ${{ inputs.working-directory }}/target/site/jacoco
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: 'ignore'

  integration-test:
    name: Run integration tests
    runs-on: ubuntu-latest
    needs: compile
    env:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@localhost:1522/XEPDB1
      VITE_BACKEND_HOST: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Oracle
        uses: samdofreelancer/cloud-workflow/actions/act-setup-oracle@develop
        with:
          oracle-password: ${{ secrets.oracle-password }}
          oracle-port: '1522'

      - name: Setup Java
        uses: samdofreelancer/cloud-workflow/actions/act-setup-java@develop
        with:
          java-version: ${{ inputs.java-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Download compiled target folder
        uses: actions/download-artifact@v4
        with:
          name: compiled-target
          path: ${{ inputs.working-directory }}/target

      - name: Download m2 repository cache
        uses: actions/download-artifact@v4
        with:
          name: m2-repository
          path: ~/.m2/repository

      - name: Run Flyway migration
        run: |
          docker compose up flyway
        env:
          ORACLE_PASSWORD: ${{ secrets.oracle-password }}

      - name: Run integration tests
        uses: samdofreelancer/cloud-workflow/actions/act-run-integration-test@develop
        with:
          working-directory: ${{ inputs.working-directory }}
          maven-profile: 'medium-test'

      - name: Aggregate integration test reports
        if: always()
        continue-on-error: true
        uses: samdofreelancer/cloud-workflow/actions/act-aggregate-test-report@develop
        with:
          working-directory: ${{ inputs.working-directory }}
          report-input-dir: target/medium-test-reports
          script-location: scripts/aggregate-test-report.js

      - name: Upload integration test reports
        if: always()
        continue-on-error: true
        uses: samdofreelancer/cloud-workflow/actions/act-upload-test-report@develop
        with:
          artifact-name: surefire-report-integration
          report-path: ${{ inputs.working-directory }}/target/medium-test-reports
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: 'ignore'

      - name: Upload jacoco integration test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-integration
          path: ${{ inputs.working-directory }}/target/site/jacoco
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: 'ignore'

      - name: Cleanup services
        if: always()
        run: docker compose down
        env:
          ORACLE_PASSWORD: ${{ secrets.oracle-password }}

  analysis:
    name: Code analysis & quality gates
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test]
    env:
      SPRING_PROFILES_ACTIVE: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: samdofreelancer/cloud-workflow/actions/act-setup-java@develop
        with:
          java-version: ${{ inputs.java-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Download jacoco reports
        uses: actions/download-artifact@v4
        with:
          path: ${{ inputs.working-directory }}/target/site/

      - name: Aggregate jacoco report
        continue-on-error: true
        run: |
          cd ${{ inputs.working-directory }}
          mvn jacoco:report-aggregate

      - name: Run SonarQube scan
        continue-on-error: true
        run: |
          cd ${{ inputs.working-directory }}
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=money-keeper \
            -Dsonar.qualitygate.wait=true
