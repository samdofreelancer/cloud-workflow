name: Java CI Workflow

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory containing backend code'
        required: false
        type: string
        default: 'backend'
      java-version:
        description: 'Java version (e.g., "17", "21")'
        required: false
        type: string
        default: '17'
      artifact-retention-days:
        description: 'Number of days to retain test reports'
        required: false
        type: number
        default: 30
    secrets:
      oracle-password:
        description: 'Oracle database password'
        required: true
      sonar-token:
        description: 'SonarCloud authentication token'
        required: false

jobs:
  compile:
    name: Compile source
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile source
        run: |
          cd ${{ inputs.working-directory }}
          mvn clean compile -DskipTests

      - name: Upload compiled target folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-target
          path: ${{ inputs.working-directory }}/target
          retention-days: 1
          if-no-files-found: 'ignore'

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: compile
    env:
      SPRING_PROFILES_ACTIVE: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download compiled target folder
        uses: actions/download-artifact@v4
        with:
          name: compiled-target
          path: ${{ inputs.working-directory }}/target

      - name: Run unit tests
        uses: samdofreelancer/cloud-workflow/actions/act-run-unit-test@develop
        with:
          working-directory: ${{ inputs.working-directory }}
          maven-profile: 'small-test'

      - name: Check what unit test artifacts were generated
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== Jacoco report location for unit tests ==="
          if [ -d "${{ inputs.working-directory }}/target/site/jacoco" ]; then
            echo "✓ jacoco directory exists"
            ls -lR ${{ inputs.working-directory }}/target/site/jacoco | head -20
          else
            echo "✗ jacoco directory NOT found"
            echo "Looking for jacoco in alternate locations:"
            find ${{ inputs.working-directory }}/target -name "jacoco*" -o -name "*coverage*" 2>/dev/null || true
          fi

      - name: Upload unit test reports
        if: always()
        continue-on-error: true
        uses: samdofreelancer/cloud-workflow/actions/act-upload-test-report@develop
        with:
          artifact-name: surefire-report-unit
          report-path: ${{ inputs.working-directory }}/target/small-test-reports
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: 'ignore'

      - name: Upload jacoco unit test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-unit
          path: ${{ inputs.working-directory }}/target/site/jacoco
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: 'ignore'

  integration-test:
    name: Run integration tests
    runs-on: ubuntu-latest
    needs: compile
    env:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.oracle-password }}
      VITE_BACKEND_HOST: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download compiled target folder
        uses: actions/download-artifact@v4
        with:
          name: compiled-target
          path: ${{ inputs.working-directory }}/target

      - name: Setup Database (Oracle + Flyway)
        uses: samdofreelancer/cloud-workflow/actions/act-setup-database@develop
        with:
          oracle-password: ${{ secrets.oracle-password }}
          oracle-port: '1522'

      - name: Verify Docker services
        run: |
          echo "=== Docker containers ==="
          docker ps
          echo "=== Network connectivity test ==="
          timeout 5 bash -c "</dev/tcp/localhost/1522" && echo "✓ Port 1522 is open" || echo "✗ Port 1522 is NOT open"
          echo "=== Datasource URL test ==="
          echo "SPRING_DATASOURCE_URL from config: jdbc:oracle:thin:@localhost:1522/XEPDB1"
          echo "ORACLE_PASSWORD is set: ${#ORACLE_PASSWORD} characters"

      - name: Run integration tests
        uses: samdofreelancer/cloud-workflow/actions/act-run-integration-test@develop
        with:
          working-directory: ${{ inputs.working-directory }}
          maven-profile: 'medium-test'
        env:
          ORACLE_PASSWORD: ${{ secrets.oracle-password }}

      - name: Check what test artifacts were generated
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== Directory structure in target ==="
          ls -d ${{ inputs.working-directory }}/target/*/ 2>/dev/null | head -10
          echo ""
          echo "=== Jacoco report location ==="
          if [ -d "${{ inputs.working-directory }}/target/site/jacoco" ]; then
            echo "✓ jacoco directory exists at ${{ inputs.working-directory }}/target/site/jacoco"
            ls -lR ${{ inputs.working-directory }}/target/site/jacoco | head -20
          else
            echo "✗ jacoco directory NOT found at ${{ inputs.working-directory }}/target/site/jacoco"
          fi

      - name: Upload integration test reports
        if: always()
        continue-on-error: true
        uses: samdofreelancer/cloud-workflow/actions/act-upload-test-report@develop
        with:
          artifact-name: surefire-report-integration
          report-path: ${{ inputs.working-directory }}/target/medium-test-reports
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: 'ignore'

      - name: Upload jacoco integration test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-integration
          path: ${{ inputs.working-directory }}/target/site/jacoco
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: 'ignore'

      - name: Cleanup services
        if: always()
        run: docker compose down
        env:
          ORACLE_PASSWORD: ${{ secrets.oracle-password }}

  analysis:
    name: Code analysis & quality gates
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test]
    env:
      SPRING_PROFILES_ACTIVE: ci
      SONAR_TOKEN: ${{ secrets.sonar-token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download unit test jacoco report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report-unit
          path: ${{ inputs.working-directory }}/target/site/jacoco-unit
        continue-on-error: true

      - name: Download integration test jacoco report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report-integration
          path: ${{ inputs.working-directory }}/target/site/jacoco-integration
        continue-on-error: true

      - name: Merge jacoco reports
        shell: bash
        run: |
          cd ${{ inputs.working-directory }}
          
          echo "=== Merging Jacoco reports ==="
          
          # Create target/site if it doesn't exist
          mkdir -p target/site
          
          # Check what reports exist
          HAS_UNIT_REPORT=false
          HAS_INTEGRATION_REPORT=false
          
          if [ -d target/site/jacoco-unit ] && [ "$(ls -A target/site/jacoco-unit)" ]; then
            echo "✓ Unit test jacoco report found"
            HAS_UNIT_REPORT=true
          else
            echo "✗ Unit test jacoco report not found or empty"
          fi
          
          if [ -d target/site/jacoco-integration ] && [ "$(ls -A target/site/jacoco-integration)" ]; then
            echo "✓ Integration test jacoco report found"
            HAS_INTEGRATION_REPORT=true
          else
            echo "✗ Integration test jacoco report not found or empty"
          fi
          
          # Use integration report if available, otherwise use unit report
          if [ "$HAS_INTEGRATION_REPORT" = true ]; then
            echo "Using integration test jacoco report"
            cp -r target/site/jacoco-integration target/site/jacoco
          elif [ "$HAS_UNIT_REPORT" = true ]; then
            echo "Using unit test jacoco report"
            cp -r target/site/jacoco-unit target/site/jacoco
          else
            echo "⚠ No jacoco reports found - coverage analysis will be skipped"
            # Create empty directory so subsequent steps don't fail
            mkdir -p target/site/jacoco
          fi
          
          # Verify final jacoco directory
          if [ -d target/site/jacoco ]; then
            echo "Final jacoco report:"
            ls -la target/site/jacoco | head -10
          fi

      - name: Run SonarQube scan
        if: env.SONAR_TOKEN != ''
        run: |
          cd ${{ inputs.working-directory }}
          mvn sonar:sonar \
            -Dsonar.projectKey=samdofreelancer_money-keeper \
            -Dsonar.organization=samdofreelancer \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true
        continue-on-error: true
