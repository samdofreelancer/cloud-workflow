name: Java CI Workflow

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory containing backend code'
        required: false
        type: string
        default: 'backend'
      java-version:
        description: 'Java version (e.g., "17", "21")'
        required: false
        type: string
        default: '17'
      artifact-retention-days:
        description: 'Number of days to retain test reports'
        required: false
        type: number
        default: 30
    secrets:
      oracle-password:
        description: 'Oracle database password'
        required: true
      sonar-token:
        description: 'SonarCloud authentication token'
        required: false

jobs:
  compile:
    name: Compile source
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile source
        run: |
          cd ${{ inputs.working-directory }}
          mvn clean compile -DskipTests

      - name: Upload compiled target folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-target
          path: ${{ inputs.working-directory }}/target
          retention-days: 1
          if-no-files-found: 'ignore'

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: compile
    env:
      SPRING_PROFILES_ACTIVE: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download compiled target folder
        uses: actions/download-artifact@v4
        with:
          name: compiled-target
          path: ${{ inputs.working-directory }}/target

      - name: Run unit tests
        uses: samdofreelancer/cloud-workflow/actions/act-run-unit-test@2a820941b73f7e44ea49aada3dab572b40657f58
        with:
          working-directory: ${{ inputs.working-directory }}
          maven-profile: 'small-test'

      - name: Check what unit test artifacts were generated
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== Jacoco report location for unit tests ==="
          if [ -d "${{ inputs.working-directory }}/target/site/jacoco" ]; then
            echo "✓ jacoco directory exists"
            echo "Number of files:"
            find ${{ inputs.working-directory }}/target/site/jacoco -type f 2>/dev/null | wc -l
            echo "Sample files:"
            ls ${{ inputs.working-directory }}/target/site/jacoco/ | head -5
          else
            echo "✗ jacoco directory NOT found"
          fi

      - name: Upload unit test reports
        if: always()
        continue-on-error: true
        uses: samdofreelancer/cloud-workflow/actions/act-upload-test-report@2a820941b73f7e44ea49aada3dab572b40657f58
        with:
          artifact-name: surefire-report-unit
          report-path: ${{ inputs.working-directory }}/target/small-test-reports
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: 'ignore'

      - name: Upload jacoco unit test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-unit
          path: ${{ inputs.working-directory }}/target/site/jacoco
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: 'ignore'

  integration-test:
    name: Run integration tests
    runs-on: ubuntu-latest
    needs: compile
    env:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.oracle-password }}
      VITE_BACKEND_HOST: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download compiled target folder
        uses: actions/download-artifact@v4
        with:
          name: compiled-target
          path: ${{ inputs.working-directory }}/target

      - name: Setup Database (Oracle + Flyway)
        uses: samdofreelancer/cloud-workflow/actions/act-setup-database@2a820941b73f7e44ea49aada3dab572b40657f58
        with:
          oracle-password: ${{ secrets.oracle-password }}
          oracle-port: '1522'

      # DB connectivity verification and readiness checks are encapsulated in act-setup-database


      - name: Run integration tests
        uses: samdofreelancer/cloud-workflow/actions/act-run-integration-test@2a820941b73f7e44ea49aada3dab572b40657f58
        with:
          working-directory: ${{ inputs.working-directory }}
          maven-profile: 'medium-test'
        env:
          ORACLE_PASSWORD: ${{ secrets.oracle-password }}

      - name: Check what test artifacts were generated
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== Directory structure in target ==="
          ls -d ${{ inputs.working-directory }}/target/*/
          echo ""
          echo "=== Jacoco report location ==="
          if [ -d "${{ inputs.working-directory }}/target/site/jacoco" ]; then
            echo "✓ jacoco directory exists"
            echo "Number of files:"
            find ${{ inputs.working-directory }}/target/site/jacoco -type f 2>/dev/null | wc -l
          else
            echo "✗ jacoco directory NOT found"
          fi

      - name: Upload integration test reports
        if: always()
        continue-on-error: true
        uses: samdofreelancer/cloud-workflow/actions/act-upload-test-report@2a820941b73f7e44ea49aada3dab572b40657f58
        with:
          artifact-name: surefire-report-integration
          report-path: ${{ inputs.working-directory }}/target/medium-test-reports
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: 'ignore'

      - name: Upload jacoco integration test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-integration
          path: ${{ inputs.working-directory }}/target/site/jacoco
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: 'ignore'

      - name: Teardown Database (Docker Compose)
        if: always()
        uses: ./actions/act-teardown-database

  analysis:
    name: Code analysis & quality gates
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test]
    env:
      SPRING_PROFILES_ACTIVE: ci
      SONAR_TOKEN: ${{ secrets.sonar-token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download unit test jacoco report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report-unit
          path: ${{ inputs.working-directory }}/target/site/jacoco-unit
        continue-on-error: true

      - name: Download integration test jacoco report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report-integration
          path: ${{ inputs.working-directory }}/target/site/jacoco-integration
        continue-on-error: true

      - name: Merge jacoco reports
        uses: samdofreelancer/cloud-workflow/actions/act-merge-jacoco-reports@2a820941b73f7e44ea49aada3dab572b40657f58
        with:
          working-directory: ${{ inputs.working-directory }}
          unit-jacoco-path: 'target/site/jacoco-unit'
          integration-jacoco-path: 'target/site/jacoco-integration'
          output-jacoco-path: 'target/site/jacoco'


      - name: Download compiled target folder
        uses: actions/download-artifact@v4
        with:
          name: compiled-target
          path: ${{ inputs.working-directory }}/target

      - name: Run Sonar scan (platform-owned)
        if: env.SONAR_TOKEN != ''
        uses: samdofreelancer/cloud-workflow/actions/act-run-sonar-scan@2a820941b73f7e44ea49aada3dab572b40657f58
        with:
          working-directory: ${{ inputs.working-directory }}
          sonar-token: ${{ secrets.sonar-token }}
          sonar-project-key: springboot-ddd-category
          sonar-organization: samdofreelancer
          sonar-host-url: https://sonarcloud.io
          qualitygate-wait: 'true'

