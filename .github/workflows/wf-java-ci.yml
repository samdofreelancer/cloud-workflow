name: Java CI Workflow

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory containing backend code'
        required: false
        type: string
        default: 'backend'
      java-version:
        description: 'Java version (e.g., "17", "21")'
        required: false
        type: string
        default: '17'
      sonar-project-key:
        description: 'SonarQube project key (must be provided by product repository)'
        required: true
        type: string
      sonar-organization:
        description: 'SonarCloud organization (optional, only for SonarCloud)'
        required: false
        type: string
      artifact-retention-days:
        description: 'Number of days to retain test reports'
        required: false
        type: number
        default: 30
    secrets:
      oracle-password:
        description: 'Oracle database password'
        required: true
      sonar-token:
        description: 'SonarCloud authentication token'
        required: false

jobs:
  unit-test:
    name: Run unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SPRING_PROFILES_ACTIVE: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: samdofreelancer/cloud-workflow/actions/act-setup-java@v1.0.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache-enabled: 'true'
          working-directory: ${{ inputs.working-directory }}

      - name: Run unit tests
        uses: samdofreelancer/cloud-workflow/actions/act-run-unit-test@v1.0.0
        with:
          working-directory: ${{ inputs.working-directory }}
          maven-profile: 'small-test'

      - name: Upload unit test reports
        if: always()
        continue-on-error: true
        uses: samdofreelancer/cloud-workflow/actions/act-upload-test-report@v1.0.0
        with:
          artifact-name: surefire-report-unit
          report-path: ${{ inputs.working-directory }}/target/small-test-reports
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: 'ignore'

      - name: Upload jacoco unit test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-unit
          path: ${{ inputs.working-directory }}/target/site/jacoco
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: 'ignore'

  integration-test:
    name: Run integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.oracle-password }}
      VITE_BACKEND_HOST: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: samdofreelancer/cloud-workflow/actions/act-setup-java@v1.0.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache-enabled: 'true'
          working-directory: ${{ inputs.working-directory }}

      - name: Setup Database (Oracle + Flyway)
        uses: samdofreelancer/cloud-workflow/actions/act-setup-database@v1.0.0
        with:
          oracle-password: ${{ secrets.oracle-password }}
          oracle-port: '1522'

      - name: Run integration tests
        uses: samdofreelancer/cloud-workflow/actions/act-run-integration-test@v1.0.0
        with:
          working-directory: ${{ inputs.working-directory }}
          maven-profile: 'medium-test'
        env:
          ORACLE_PASSWORD: ${{ secrets.oracle-password }}

      - name: Upload integration test reports
        if: always()
        continue-on-error: true
        uses: samdofreelancer/cloud-workflow/actions/act-upload-test-report@v1.0.0
        with:
          artifact-name: surefire-report-integration
          report-path: ${{ inputs.working-directory }}/target/medium-test-reports
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: 'ignore'

      - name: Upload jacoco integration test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-integration
          path: ${{ inputs.working-directory }}/target/site/jacoco
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: 'ignore'

      - name: Teardown Database
        if: always()
        uses: samdofreelancer/cloud-workflow/actions/act-teardown-database@v1.0.0

  analysis:
    name: Code analysis & quality gates
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test]
    permissions:
      contents: read
    env:
      SPRING_PROFILES_ACTIVE: ci
      SONAR_TOKEN: ${{ secrets.sonar-token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: samdofreelancer/cloud-workflow/actions/act-setup-java@v1.0.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache-enabled: 'true'
          working-directory: ${{ inputs.working-directory }}

      - name: Download unit test jacoco report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report-unit
          path: ${{ inputs.working-directory }}/target/site/jacoco-unit
        continue-on-error: true

      - name: Download integration test jacoco report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report-integration
          path: ${{ inputs.working-directory }}/target/site/jacoco-integration
        continue-on-error: true

      - name: Merge jacoco reports
        uses: samdofreelancer/cloud-workflow/actions/act-merge-jacoco-reports@v1.0.0
        with:
          working-directory: ${{ inputs.working-directory }}
          unit-jacoco-path: 'target/site/jacoco-unit'
          integration-jacoco-path: 'target/site/jacoco-integration'
          output-jacoco-path: 'target/site/jacoco'

      - name: Compile for analysis
        shell: bash
        run: |
          cd ${{ inputs.working-directory }}
          mvn clean compile -DskipTests

      - name: Run Sonar scan
        if: env.SONAR_TOKEN != ''
        uses: samdofreelancer/cloud-workflow/actions/act-run-sonar-scan@v1.0.0
        with:
          working-directory: ${{ inputs.working-directory }}
          sonar-token: ${{ secrets.sonar-token }}
          sonar-project-key: ${{ inputs.sonar-project-key }}
          sonar-organization: ${{ inputs.sonar-organization }}
          qualitygate-wait: 'true'

